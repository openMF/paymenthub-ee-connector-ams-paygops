name: Test
on: [push, pull_request]
jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      # The runner default JDK is not 21; without this step the build fails on
      # `targetCompatibility = 21`.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build project
        run: ./gradlew clean build
      - name: Build Docker image
        run: docker build . -t paymenthubee.mifos.io/phee/paymenthub-ee-connector-ams-paygops
